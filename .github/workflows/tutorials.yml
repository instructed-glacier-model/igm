name: Tutorial Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-pypi:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pypi-${{ hashFiles('setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-pypi-
      - name: Install igm-model from PyPI
        run: pip install igm-model
      - name: Clone igm-examples
        run: git clone --depth 1 --branch dev https://github.com/instructed-glacier-model/igm-examples igm-examples
      - name: Aletsch Part A step 1 - simple SMB
        working-directory: igm-examples/aletsch
        run: igm_run +experiment=params_A_step1 processes.time.end=1902 outputs.live_dashboard.headless=true
      - name: Aletsch Part A step 2 - custom SMB module
        working-directory: igm-examples/aletsch
        run: igm_run +experiment=params_A_step2 processes.time.end=1902 outputs.live_dashboard.headless=true
      - name: Aletsch Part A step 3 - accumulation/melt SMB
        working-directory: igm-examples/aletsch
        run: igm_run +experiment=params_A_step3 processes.time.end=1882 outputs.live_dashboard.headless=true
      - name: Aletsch Part A step 4 - particle tracking
        working-directory: igm-examples/aletsch
        run: igm_run +experiment=params_A_step4 processes.time.end=1882
      - name: Aletsch Part B - parameter optimization (single run)
        working-directory: igm-examples/aletsch
        run: igm_run +experiment=params_B_1obj processes.time.end=1882

  smoke-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-source-${{ hashFiles('setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-source-
      - name: Install igm-model from source
        run: pip install -e .
      - name: Clone igm-examples
        run: git clone --depth 1 --branch dev https://github.com/instructed-glacier-model/igm-examples igm-examples
      - name: Aletsch Part A step 1 - simple SMB
        working-directory: igm-examples/aletsch
        run: igm_run +experiment=params_A_step1 processes.time.end=1902 outputs.live_dashboard.headless=true
      - name: Aletsch Part A step 2 - custom SMB module
        working-directory: igm-examples/aletsch
        run: igm_run +experiment=params_A_step2 processes.time.end=1902 outputs.live_dashboard.headless=true
      - name: Aletsch Part A step 3 - accumulation/melt SMB
        working-directory: igm-examples/aletsch
        run: igm_run +experiment=params_A_step3 processes.time.end=1882 outputs.live_dashboard.headless=true
      - name: Aletsch Part A step 4 - particle tracking
        working-directory: igm-examples/aletsch
        run: igm_run +experiment=params_A_step4 processes.time.end=1882
      - name: Aletsch Part B - parameter optimization (single run)
        working-directory: igm-examples/aletsch
        run: igm_run +experiment=params_B_1obj processes.time.end=1882
