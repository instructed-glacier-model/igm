name: Tutorial Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-pypi:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pypi-${{ hashFiles('setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-pypi-
      - name: Install igm-model from PyPI
        run: pip install igm-model
      - name: Clone igm-examples
        run: git clone --depth 1 https://github.com/instructed-glacier-model/igm-examples igm-examples
      - name: Aletsch basic forward run
        working-directory: igm-examples/aletsch-basic/experiment
        run: igm_run +experiment=params processes.time.end=1902
      - name: Aletsch forward run with particle tracking
        working-directory: igm-examples/aletsch-basic/experiment
        run: igm_run +experiment=params_id_adam processes.time.end=1902
      - name: Aletsch realistic climate run
        working-directory: igm-examples/aletsch-1880-2100/experiment
        run: igm_run +experiment=params processes.time.end=1882

  smoke-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-source-${{ hashFiles('setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-source-
      - name: Install igm-model from source
        run: pip install -e .
      - name: Clone igm-examples
        run: git clone --depth 1 https://github.com/instructed-glacier-model/igm-examples igm-examples
      - name: Aletsch basic forward run
        working-directory: igm-examples/aletsch-basic/experiment
        run: igm_run +experiment=params processes.time.end=1902
      - name: Aletsch forward run with particle tracking
        working-directory: igm-examples/aletsch-basic/experiment
        run: igm_run +experiment=params_id_adam processes.time.end=1902
      - name: Aletsch realistic climate run
        working-directory: igm-examples/aletsch-1880-2100/experiment
        run: igm_run +experiment=params processes.time.end=1882
