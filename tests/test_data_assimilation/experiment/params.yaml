  - oggm_shop
  - local
- override /processes:
  - iceflow
- override /assimilations:
  - data_assimilation

inputs:
  oggm_shop:
    RGI_ID: RGI60-11.01238
    RGI_version: 6

assimilations:
  data_assimilation:
    nbitmax: 100
    fitting:
       usurfobs_std: 0.3
       velsurfobs_std: 0.25
