data_assimilation_SR:
  optimization:
    minimizer_patience: 20
    retrain_lr: 1e-5 # Learning rate for network retraining steps
    retrain_iter: 10 # number of times we iterate between DA minimize and network retraining
    nbitmax: 1000 # Max optimizer iterations (also used as the final iteration label in optimize.nc)
    grad_precond_lambda: 0.0 # Lambda for gradient preconditioning (0.0 means no preconditioning)
    grad_precond_p: 1 # Exponent for gradient preconditioning (1 means L1, 2 means L2)
    grad_precond_cg_max_iter: 50 # Max CG iterations for gradient preconditioning
    grad_precond_cg_tol: 1e-6 # CG tolerance for gradient preconditioning
    retrain_anchor_weight: 0.0 # Weight that penalizes deviation of the retrained network from the original pretrained network (i.e. L2 distance between the weights of the two networks)
    retrain_replay_data_weight: 0.0 # Weight for replaying past training examples
    retrain_replay_phys_weight: 0.0 # Weight for physics-based replay loss (i.e. deviation of the network predictions from the physics constraints on past training examples)
  output:
    freq: 200 # Callback + NetCDF write cadence in iterations (iteration 0 is always written)
    vars_to_save: [usurf,thk,icemask,velbase_mag,velsurf_mag,velsurfobs_mag] # 2D fields saved each write; *_mag and sliding_ratio are computed in update_ncdf_optimize when requested
  variables:
  - { name: thk, transform: identity,  lower_bound: 0.0 , upper_bound: 1000.0 , mask: icemask}
  objective:
    misfit:
      - { name: velsurf, kind: gaussian, components: [uvelsurf, vvelsurf], obs: [uvelsurfobs, vvelsurfobs], std: 1.0 }
    regularization:
      - { name: thk, penalty: biharmonic, lam: 100000.0 }