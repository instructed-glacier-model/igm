smb:
  # Choose the surface mass-balance implementation: simple | oggm | accpdd
  method: simple

  # SMB imposed outside the icemask (if any) where the computed SMB is positive [m ice eq. yr-1]
  smb_outside_icemask: -10.0

  # ------------------------------------------------------------------
  # simple — gradient-based SMB from a time-series of (gradabl, gradacc,
  # ela, maxacc). Mirrors the legacy `smb_simple` module.
  # ------------------------------------------------------------------
  simple:
    update_freq: 1.0
    file: param.txt
    array: []

    # Block from Insolation correction (Henz et al. 2025, TC, https://doi.org/10.5194/tc-19-5913-2025)
    # switch the ELA correction for insolation on/off
    correction_for_insolation_enabled: false
    correction_for_insolation:
      # solar elevation angle above the horizon [degrees], 
      # --> this is depending on the average latitude of the study region
      solar_elevation: 60.0 # for Alps latitude, midsummer midday value (see Henz et al. 2025)
      # solar azimuth, clockwise from north [degrees] (180 = sun from the south, e.g. for the Northern hemisphere)
      solar_azimuth: 180.0
      # ELA shift per degree of incidence-angle difference to a flat surface [m / degree]
      # (replaces the old aspect_enhancement_factor: old factor f  ->  5.0 * f here)
      ela_per_degree_incidence: 5.0 # comming from Henz et al. 2025 https://doi.org/10.5194/tc-19-5913-2025
      # save check_insolation_correction.png (topography + ELA shift) at the first SMB update
      plot_insolation_check: false

  # ------------------------------------------------------------------
  # oggm — temperature-index melt model using OGGM calibration json.
  # Requires state.precipitation and state.air_temp (e.g. from a climate
  # module). Mirrors the legacy `smb_oggm` module.
  # ------------------------------------------------------------------
  oggm:
    update_freq: 1.0
    ice_density: 910.0
    wat_density: 1000.0
    melt_enhancer: 1.0

  # ------------------------------------------------------------------
  # accpdd — accumulation + positive-degree-day (Hock 2003 / PyPDD)
  # melt model. Requires state.precipitation, state.air_temp, and
  # optionally state.air_temp_sd. Mirrors the legacy `smb_accpdd` module.
  # ------------------------------------------------------------------
  accpdd:
    update_freq: 1.0
    refreeze_factor: 0.6
    thr_temp_snow: 0.0
    thr_temp_rain: 2.0
    melt_factor_snow: 1.095726596343   # m w.e. yr-1 °C-1 (= 3 mm w.e. d-1 °C-1)
    melt_factor_ice:  2.921937590248   # m w.e. yr-1 °C-1 (= 8 mm w.e. d-1 °C-1)
    shift_hydro_year: 0.75
    ice_density: 910.0
    wat_density: 1000.0
    smb_maximum_accumulation: 6.0
