thk:

  scheme: explicit                     # production default; ffsl/implicit are opt-in, implicit_x is for flowlines
  slope_type: superbee                 # limiter for scheme: explicit; ffsl uses its monotone Superbee reconstruction
  divflux_smooth_sigma: 0.0            # if > 0, Gaussian-filter (std in cells) the staggered fluxes before the divergence (conservative flux smoothing; explicit only)
  ratio_density: 0.910                 # rho_ice / rho_water for flotation

  domain:
    constraints: []                    # intersect reusable active-cell constraints; empty evolves the full grid

  boundary:                            # independent thickness-transport domain sides
    left: zero                         # zero/open | symmetric/no-flux | periodic
    right: zero                        # periodic must be set on both left and right
    top: zero                          # rows at the beginning of the y dimension
    bottom: zero                       # periodic must be set on both top and bottom

  implicit:                            # used with scheme: implicit or implicit_x
    theta: 1.0                         # 1.0 = backward Euler; 0.5 = Crank-Nicolson
    solver:                            # used only with scheme: implicit
      tol: 1.0e-6                      # requested relative residual tolerance (bounded below by dtype roundoff)
      max_iter: 1000                   # matrix-free BiCGSTAB iteration limit
      max_restarts: 8                  # low-memory residual replacements after breakdown or residual drift
      failure_policy: stop             # stop the run and retain old H on failure | accept the best iterate

  ffsl:                                # used only with scheme: ffsl
    max_deformation: 0.5               # internal substeps limit dt*||grad(velocity)||; independent of uniform-flow CFL
    max_substeps: 128                  # safety cap for deformation-controlled internal substeps
    limit_policy: stop                 # stop the run and retain old H if the requested count exceeds max_substeps | accept

  calving_front: false                 # optional front evolution
  method: sub_grid                     # sub_grid (Albrecht/PISM) | level_set

  front_slope_type: godunov            # limiter at the front band; godunov avoids pile-up
  interior_slope_type: superbee        # limiter in deep bulk; equal to front disables hybrid
  only_marine: true                    # restrict calving to cells with topg < water_level
  extend_halo: 2                       # iceflow-facing thk padding width; 0 = partial cells only
  extend_thresh: 0.95                  # halo cells below interior_mean*thresh get padded

  sub_grid:
    href_cap_factor: 2.0               # Href cap = factor * H_threshold (kills cold-start bursts)
    promote_iters: 5                   # passes of partial-cell -> full promotion per outer step
    calve_cliff: true                  # drain thk at front full cells -> actual retreat mechanism

  level_set:                           # Bondzio 2016 / ISSM
    only_near_front: false             # Gaussian-damp calving forcing away from psi=0
    band_cells: 3                      # width of that Gaussian, in cells
    reinit_freq: 5                     # Sussman reinit every N outer steps (0 = never)
    reinit_iter: 5                     # pseudo-time iterations per reinit
    reinit_iter_initial: 50            # iterations for the initial psi build from +/-dx mask
    phi_eps: 1.0e-3                    # floor on phi when recovering thk = M / phi
    cap_partial: false                 # clip partial-cell thk to interior mean (lossy)
