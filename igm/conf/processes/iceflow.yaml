iceflow:
  method: unified
  force_max_velbar: 0.0
  physics:
    energy_components: [viscosity, gravity, sliding]
    sliding:
      law: weertman
      use_mask_gr: false
      slidingco: 0.0464      # legacy stack (was init_slidingco; MPa)
      tau_ref: 0.2153697218796329  # new (unified) stack; = slidingco * u_ref^(1/m) so physics matches u_ref=100
      regularization: 1.0e-10  # was sliding.<law>.regu
      exponent: 3.0            # was sliding.<law>.exponent
      u_ref: 100.0             # m/yr — active in 'unified' only; emulated/solved/diagnostic require u_ref=1.0
      N_ref: 1.0               # budd only
      mu: 0.4                  # regu_coulomb only
      q_exponent: 1.0          # budd only (1.0=linear, 0.5=Tsai sublinear)
      # mohr_coulomb-specific keys (ignored by other laws):
      phi: 30.0      # uniform friction angle (deg); used unless both bed_min and bed_max are finite
      phi_min: 15.0  # friction angle at bed = bed_min
      phi_max: 45.0  # friction angle at bed = bed_max
      bed_min: .nan  # NaN disables bed-elevation interpolation -> uniform phi
      bed_max: .nan
      tauc_min: 1.0e-1     # MPa, floor on tau_c
      tauc_max: 1.0e+4     # MPa, ceiling on tau_c
      tauc_ice_free: 1.0   # MPa, HARD assignment in ice-free cells
    gravity_cst: 9.81
    ice_density: 910.0
    water_density: 1000.0
    viscosity:
      arrhenius: 78.0          # was init_arrhenius
      enhancement_factor: 1.0
      exponent: 3.0            # was exp_glen
      regularization: 1.0e-05  # was regu_glen
    thr_ice_thk: 0.1
    max_sr: 1.0e+20
    force_negative_gravitational_energy: false
    cf_eswn: []
  numerics:
    precision: single
    ord_grad_u: l2_weighted
    ord_grad_theta: l2_weighted
    Nz: 4
    vert_spacing: 4.0
    basis_horizontal: central
    basis_vertical: Lagrange
  solver:
    step_size: 1.0
    nbitmax: 100
    optimizer: adam
    print_cost: false
    fieldin: [thk, usurf, arrhenius, slidingco, dX]
  emulator:
    fieldin: [thk, usurf, arrhenius, slidingco, dX]
    retrain_freq: 10
    print_cost: false
    lr: 2.0e-05
    lr_init: 0.0001
    lr_decay: 0.95
    warm_up_it: -10000000000.0
    nbit_init: 1
    nbit: 1
    framesizemax: 1000
    split_patch_method: sequential
    pretrained: true
    name: ''
    save_model: false
    exclude_borders: 0
    optimizer: Adam
    optimizer_clipnorm: 1.0
    optimizer_epsilon: 1.0e-07
    save_cost: ''
    output_directory: ''
    plot_sol: False
    pertubate: false
    network:
      architecture: cnn
      params: {}    # emulated-mode (cnn) hyperparameters; cnn reads the flat fields below
      multiple_window_size: 0
      activation: LeakyReLU
      nb_layers: 16
      nb_blocks: 4
      nb_out_filter: 32
      conv_ker_size: 3
      dropout_rate: 0.0
      weight_initialization: glorot_uniform
      cnn3d_for_vertical: false
      batch_norm: false
      l2_reg: 0.0
      separable: false
      residual: true
  diagnostic:
    save_freq: 1
    filename_metrics: diagnostic_metrics.txt
  unified:
    mapping: network
    bcs: []
    bc:
      dirichlet:
        left: 0.0
        right: 0.0
        top: 0.0
        bottom: 0.0
    optimizer: adam
    nbit: 5
    nbit_init: 300
    nbit_warmup: -1
    retrain_freq: 5
    retrain_threshold: 1.0e+10 # for now it corresponds to a z-score (1.0e+10 is default as its quite high and will default to the retrain_freq most likely)
    newton:
      damping: 1e-6
    adam:
      lr: 5.0e-04
      lr_init: 2.0e-03
      lr_decay: 1.0
      lr_decay_steps: 1000
      optimizer_clipnorm: 1.0
    lbfgs:
      memory: 10
      alpha_min: 0.0
    cg_newton:
      cg_tol: 1e-20
      warm_start: true
      cg_max_iter: 100
      line_search_compile: true
      damping: 1e-6
      damping_adaptive: false
      damping_min: 1e-12
      damping_max: 1e2
      damping_down: 0.25
      damping_up: 4.0
      hvp_mode: autodiff
      hvp_verify: false
      probe_mode: fd
      preconditioner: block_jacobi
      precond_update_freq: 1
    trust_region:
      cg_max_iter: 100
      cg_tol: 1e-12
      delta_init: 1e2
      delta_max: 1e10
      eta: 0.15
      damping: 1e-6
    muon:
      lr: 2.0e-02
      momentum: 0.95
      ns_steps: 5
      lr_1d: 3.0e-04
    soap:
      lr: 3.0e-04
      beta1: 0.95
      beta2: 0.999
      eps: 1.0e-08
      precond_freq: 10
      damping: 1.0e-08
    sequential:
      stages: []
    line_search: hager-zhang
    inputs: [thk, usurf, arrhenius, tau_ref, dX]
    normalization:
      method: adaptive
      fixed:
        inputs_offsets:
          thk: 0.0
          usurf: 0.0
          arrhenius: 0.0
          tau_ref: 0.0
          dX: 0.0
          X: 0.0
          Y: 0.0
        inputs_variances:
          thk: 1.0
          usurf: 1.0
          arrhenius: 1.0
          tau_ref: 1.0
          dX: 1.0
          X: 1.0
          Y: 1.0
    network:
      debug_mode: false
      debug_freq: 100
      pretrained: false
      pretrained_path: ""
      print_summary: false
      output_scale: 1.0
      architecture: dahunet
      # Architecture hyperparameters for the from-scratch path (pretrained: false).
      # Owned by the unified mode (no longer read from emulator.network).
      # Keys depend on `architecture`; an empty dict uses the architecture's
      # built-in defaults. These are the Optuna-tuned dahunet defaults.
      params:
        backend: cnn
        features: [dsdx, dsdy, grad_s, u_sia, u_weertman]
        nb_out_filter: 24
        nb_layers: 6
        conv_ker_size: 3
        residual: true
    adaptive_time:
      # Temporal lever (B) — decides WHEN to retrain. Mirror of adaptive_patching (C).
      # Additive: never moves top-level retrain_freq / retrain_threshold, only dispatches.
      method: none                     # none (fix retrain_freq) | shift_distribution (Hotelling-T2 vs
                                       # retrain_threshold, early trigger; retrain_freq kept as safety
                                       # net = legacy combined behaviour) | credit
      enabled_observation: false       # diagnostic credit_log.jsonl, also when method != credit
      credit:                          # only used when method=credit (or enabled_observation=true)
        kappa: 1.0e-3                  # credit threshold in z-units (dimensionless)
        retrain_freq_max: 100          # safety ceiling (steps without trigger)
        record_path: credit_log.jsonl  # JSONL log of credit / Δ per step
    adaptive_patching:
      enabled: false
      # Step 1 — window generation
      windows: peak_augmented        # regular_grid | peak_augmented (default)
      n_extra_peaks: -1              # peak_augmented only; -1 = auto (match grid count)
      patch_size: 64                 # tile side (must be > 0), decoupled from framesizemax
      batch_cells_max: 2250000       # GPU budget: cells (patches × ly·lx) per training batch;
                                     # bs = floor(batch_cells_max / (ly·lx)), computed once.
                                     # Default = 1500² (validated on the exp1 campaign).
      # Step 2 — scoring + thk eligibility filter
      selection: scored              # all (uniform over eligibles) | scored
      min_thk_in_window: 0.0         # (m) max(thk) below this → ineligible. 
      score_alpha: 1.0               # p[i] ∝ (score[i] + eps)^score_alpha. α=0 → uniform;
      temporal_downsample: 1         # downsampling factor for the cached input snapshot.
      # Step 3 — training_windows
      shuffle_training_windows: true # shuffle the N_train indices before batching
      record_training_windows: false # write one JSONL line per call to record_path
      record_path: null              # null → training_windows.jsonl in cwd
      rng_seed: null                 # null → fresh randomness per call 
      rescore_freq: 10               # Caching: steps 1+2 recomputed every rescore_freq
    data_preparation:
      framesizemax: 100000000
      patches_per_batch: 1
    halt:
      freq: 1
      success: []
      failure: []
      criteria: 
        rel_tol:
          tol: 1e-3
          ord: l2
        abs_tol:
          tol: 1e-3
          ord: l2_weighted
        patience: 
          patience: 100
        inf: {}
        nan: {}
      metrics:
        theta: {}
        u: {}
        cost: {}
        grad_u_norm: {}
        grad_theta_norm: {}
    display:
      print_cost: false
      print_cost_freq: 1
  vertical_velocity:
    enabled: false
    version: 2
    method: kinematic
