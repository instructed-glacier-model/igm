effective_pressure:
  # How to compute state.effective_pressure (Pa). Modes:
  #   constant_one    — N = 1 Pa everywhere (use with Budd N_ref=1 for Weertman-like behaviour)
  #   percentage      — N = (1 - percentage) * rho_ice * g * h
  #   ocean_connected — N = rho_ice*g*h - rho_water*g*max(water_level - topg, 0)
  #   from_input      — leave state.effective_pressure as already loaded
  #
  # Unit is Pa for backward compatibility with the legacy Budd N. The
  # Budd cost depends on the ratio N/N_ref so the choice of unit cancels
  # provided N_ref is in the same unit (default 1.0 Pa).
  mode: ocean_connected
  percentage: 0.0      # only used if mode == percentage
  N_min: 1.0e+3        # Pa: floor (1 kPa) applied after the chosen formula
