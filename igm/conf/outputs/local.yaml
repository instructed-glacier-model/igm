local:
  file_format_list: ['netcdf']
  output_file: output.nc
  keep_open: false
  complevel: 0              # lossless compression level (1-9, with shuffle); 0 = uncompressed
  compression: zlib         # codec when complevel > 0: zlib, zstd or bzip2
  significant_digits: null  # lossy: keep this many significant digits in float fields
  vars_to_save:
    - topg
    - usurf
    - thk
    - smb
    - velbar_mag
    - velsurf_mag
    - uvelsurf
    - vvelsurf
    - wvelsurf
  write_ts: True
  output_ts_file: output_ts.nc
