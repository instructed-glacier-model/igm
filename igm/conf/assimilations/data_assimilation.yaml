data_assimilation:
  store_freq: 100
  control_list:
  - thk
  cost_list:
  - velsurf
  - thk
  - icemask
  variables:
  - { name: thk, transform: identity }
  - { name: slidingco, transform: identity }
  - { name: arrhenius, transform: identity }
  optimizer: ADAM
  optimization:
    nbitmin: 50
    nbitmax: 500
    step_size: 1.0
    step_size_decay: 0.9
    init_zero_thk: false
    sole_mask: false
    retrain_iceflow_model: false
    fix_opti_normalization_issue: true
    method: ADAM
    obstacle_constraint: [reproject]
    optimizer_clipnorm: 10000000.0
    optimizer_epsilon: 1.0e-07
    pertubate: False
    nb_relaxation_steps: 0
    relaxation_freq: 0
    patience: 0
    # Patch-wise inversion: when the grid exceeds patch_size, the gradient
    # tape runs on overlapping windows of patch_size + 2*patch_halo and only
    # the halo-stripped core of each window gradient is kept, bounding peak
    # GPU memory by the window size. 0 disables (always full-grid tape).
    # patch_halo must exceed the emulator receptive-field radius.
    patch_size: 1024
    patch_halo: 64
  regularization:
    thk: 10.0
    thk_version: 1
    thk_2nd_der: 1.0e+6
    thk_1st_der: 1.0e+2
    thk_1st_der_disc_version: new
    abl_acc_balance: 1.0
    slidingco: 1.0
    tau_ref: 1.0       # mirror of slidingco for the new (unified) stack
    arrhenius: 10.0
    divflux: 1.0
    usurf: 0.0         # smoothness of (usurf - usurfobs) when usurf is a control; 0 disables
    smooth_anisotropy_factor: 1.0
    smooth_anisotropy_factor_sl: 1.0
    smooth_anisotropy_var: 'vel'
    convexity_weight: 0.0
    convexity_power: 1.3
    to_regularize: topg
  fitting:
    usurfobs_std: 2.0
    velsurfobs_std: 1.0
    thkobs_std: 3.0
    divfluxobs_std: 1.0
    volobsprop_std: 0.1
    uniformize_thkobs: true
    include_low_speed_term: false
    velsurfobs_thr: 0.0
    log_slidingco: false
  divflux:
    method: upwind
    smooth_sigma: 0.0
    force_zero_sum: false
  scaling:
    thk: 2.0
    usurf: 0.5
    slidingco: 0.0001
    tau_ref: 0.0001     # mirror of slidingco for the new (unified) stack
    arrhenius: 0.1
  output:
    freq: 50
    plot2d_live: true
    plot2d: true
    save_result_in_ncdf: geology-optimized.nc
    save_iterat_in_ncdf: true
    editor_plot2d: vs
    vars_to_save:
    - usurf
    - thk
    - slidingco
    - velsurf_mag
    - velsurfobs_mag
    - divflux
    - icemask
  cook:
    infer_params: false
    tidewater_glacier: false
    vol_std: 1000.0
