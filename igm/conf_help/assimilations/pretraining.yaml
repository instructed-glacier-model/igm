data_dir:
  Type: string
  Units: dimless
  Description: "Path to the TFRecord dataset root directory. Must contain metadata.json and train/ and val/ subdirectories organised by Nz."
out_dir:
  Type: string
  Units: dimless
  Description: "Root directory under which the experiment output folder is created."
experiment_name:
  Type: string
  Units: dimless
  Description: "Name of the subdirectory created inside out_dir that holds the trained model, checkpoints, and figures."
batch_size:
  Type: integer
  Units: dimless
  Description: "Effective batch size: the number of training examples processed before each optimizer weight update. Must be divisible by micro_batch_size."
micro_batch_size:
  Type: integer
  Units: dimless
  Description: "Number of examples processed simultaneously on the GPU per forward-backward pass. Gradients are accumulated over batch_size / micro_batch_size micro-steps before each update. Reduce this if GPU memory is insufficient for the full batch size."
epochs:
  Type: integer
  Units: dimless
  Description: "Total number of training epochs."
steps_per_epoch:
  Type: integer
  Units: dimless
  Description: "Number of optimizer weight updates performed per epoch."
val_steps:
  Type: integer
  Units: dimless
  Description: "Number of validation mini-batches evaluated at the end of each epoch."
learning_rate:
  Type: float
  Units: dimless
  Description: "Learning rate for the Adam optimizer."
grad_clip_norm:
  Type: float
  Units: dimless
  Description: "Global-norm clip applied to the accumulated gradient before each optimizer update (passed as Adam's clipnorm). Acts as an architecture-agnostic safety net against physics-loss-driven blow-ups: it bounds the per-step weight update without changing gradient direction, so it leaves healthy training untouched when it does not bind. Set <= 0 to disable. Monitor the logged grad_norm and raise this if the clip is active during well-behaved training. Independently of this clip, any update with a non-finite gradient is always skipped."
split_seed:
  Type: integer
  Units: dimless
  Description: "Integer seed used to shuffle the list of training shards at the start of training. Set to a fixed value for reproducibility."
loss_type:
  Type: string
  Units: dimless
  Description: "Data loss function applied to predicted vs. reference velocities. Options: huber (recommended; robust to outliers near glacier margins) or mse."
huber_delta:
  Type: float
  Units: "m y^{-1}"
  Description: "Transition point of the Huber loss: residuals smaller than delta are penalised quadratically, larger residuals linearly. Only used when loss_type is huber."
warmup_steps:
  Type: integer
  Units: dimless
  Description: "Number of optimizer updates at the start of training during which the physics loss is disabled. The network learns from data alone during this phase, which stabilises early training."
lambda_update_every:
  Type: integer
  Units: dimless
  Description: "After the warmup phase, the physics loss weight lambda is recomputed every this many optimizer steps by comparing the data and physics gradient statistics."
lambda_weight_stat:
  Type: string
  Units: dimless
  Description: "Gradient statistic used to balance the data and physics terms when recomputing lambda. 'norm' uses the global L2 norm ratio, driving the physics gradient to equal magnitude with the data gradient. 'std' uses the per-parameter gradient standard deviation (inverse-Dirichlet weighting, Maddu et al. 2022), which is more robust to heavy-tailed physics gradients (e.g. exploding energy gradients in fast-flow / high-shear cells). Options: norm or std."
lambda_subordinacy:
  Type: float
  Units: dimless
  Description: "Target ratio rho for the physics gradient relative to the data gradient: lambda is driven so that stat(lambda * g_phys) = rho * stat(g_data). rho = 1.0 balances the two terms to equal magnitude (original behaviour); rho < 1 (e.g. 0.2) keeps physics subordinate to data, acting as a regulariser rather than a co-equal objective."
lambda_ema:
  Type: float
  Units: dimless
  Description: "Exponential moving average factor applied when updating lambda. Values close to 1 produce slow, stable adaptation; lower values respond faster but with more variance. Note: very high values combined with a tight lambda_max_change prevent lambda from reaching its computed target, turning the adaptive scheme into a slow fixed ramp."
lambda_min:
  Type: float
  Units: dimless
  Description: "Lower bound on the adaptive physics loss weight lambda."
lambda_max:
  Type: float
  Units: dimless
  Description: "Upper bound on the adaptive physics loss weight lambda."
lambda_max_change:
  Type: float
  Units: dimless
  Description: "Multiplicative clamp applied to each lambda update: the new value is restricted to [lambda / c, lambda * c] where c is this parameter. Prevents large sudden changes. If set too close to 1 (together with a high lambda_ema), lambda cannot reach the gradient-balanced target and instead creeps monotonically; raise it (e.g. 3.0) to let lambda settle at the computed target."
resume:
  Type: boolean
  Units: dimless
  Description: "Resume training from the latest checkpoint in out_dir/experiment_name/checkpoints/. The experiment directory must already exist. Has no effect when save_model is false."
make_plots:
  Type: boolean
  Units: dimless
  Description: "Write a loss curve figure and per-epoch speed-comparison plots to out_dir/experiment_name/figures/ during training."
save_model:
  Type: boolean
  Units: dimless
  Description: "Save the trained emulator artifact and training checkpoints to disk. Set to false during hyperparameter searches to avoid writing many models."
