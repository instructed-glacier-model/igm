data_dir:
  Type: string
  Description: "Path to the directory containing the TFRecord glacier catalog used for training."
  Units: dimless
batch_size:
  Type: integer
  Description: "Number of samples per training batch for the neural network."
  Units: dimless
epochs:
  Type: integer
  Description: "Total number of training epochs for neural network pre-training."
  Units: dimless
experiment_name:
  Type: string
  Description: "Name of the experiment; used as the subdirectory under `out_dir` where checkpoints, figures, and artifacts are saved."
  Units: dimless
loss_type:
  Type: string
  Description: "Loss function for the data fidelity term: `mse` (mean squared error) or `huber`."
  Units: dimless
learning_rate:
  Type: float
  Description: "Learning rate for the Adam optimizer."
  Units: dimless
out_dir:
  Type: string
  Description: "Base output directory; the experiment subdirectory (named by `experiment_name`) is created here to store checkpoints, figures, and artifacts."
  Units: dimless
resume:
  Type: boolean
  Description: "If True, restores the latest checkpoint from the experiment directory and continues training from the last saved epoch; raises an error if no checkpoint is found."
  Units: dimless

