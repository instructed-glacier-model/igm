h_water_till_max:
  Type: float
  Units: m
  Description: "Maximum till water layer thickness (capacity). Till saturation s = h_water_till / h_water_till_max drives the effective-pressure parameterisation in `effective_pressure` mode `till_storage`."
drainage_rate:
  Type: float
  Units: m/yr
  Description: "Constant basal drainage rate to the groundwater system, subtracted at every time step. Set to 0 to disable drainage."
water_density:
  Type: float
  Units: kg m^-3
  Description: "Density of liquid water used to convert basal melt rate (m ice/yr) to a water-equivalent volume flux."
