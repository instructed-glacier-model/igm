method:
  Type: string
  Units: dimless
  Description: "SMB implementation to use: `simple`, `oggm`, or `accpdd`."
smb_outside_icemask:
  Type: float
  Units: m yr^{-1} ice eq.
  Description: "SMB imposed outside the icemask (if an icemask is provided) where the computed SMB is positive, to prevent ice build-up in masked-out areas, which results from accumulation plus incoming ice flux. Lower it (e.g. -50) if ice still builds up outside the mask."
simple:
  update_freq:
    Type: float
    Units: yr
    Description: "Update SMB every X years."
  file:
    Type: string
    Units: dimless
    Description: "Input file for the simple SMB model (columns: time, gradabl, gradacc, ela, accmax)."
  array:
    Type: list
    Units: dimless
    Description: "Inline time-dependent SMB parameters (time, gradabl, gradacc, ela, accmax); overrides file if non-empty."
  correction_for_insolation_enabled:
    Type: bool
    Units: dimless
    Description: "Enable the correction of the ELA for insolation (aspect and slope of the surface)."
  correction_for_insolation:
    solar_elevation:
      Type: float
      Units: ° (degree)
      Description: "Solar elevation angle above the horizon (one single value as a midsummer midday value, see Henz et al. 2025) [degrees]."
    solar_azimuth:
      Type: float
      Units: ° (degree)
      Description: "Solar azimuth angle [degrees]."
    ela_per_degree_incidence:
      Type: float
      Units: m °^{-1}
      Description: "Change in ELA per degree of incidence angle [m/°]."
    plot_insolation_check:
      Type: bool
      Units: dimless
      Description: "Plot a diagnostic figure to check the insolation correction.
oggm:
  update_freq:
    Type: float
    Units: yr
    Description: "Update SMB every X years."
  ice_density:
    Type: float
    Units: kg m^{-3}
    Description: "Ice density used to convert melt from water equivalent."
  wat_density:
    Type: float
    Units: kg m^{-3}
    Description: "Water density used to convert melt from water equivalent."
  melt_enhancer:
    Type: float
    Units: dimless
    Description: "Multiplicative factor applied to the melt rate."
accpdd:
  update_freq:
    Type: float
    Units: yr
    Description: "Update SMB every X years."
  refreeze_factor:
    Type: float
    Units: dimless
    Description: "Fraction of meltwater that refreezes (Hock 2003)."
  thr_temp_snow:
    Type: float
    Units: °C
    Description: "Temperature threshold below which precipitation falls as snow."
  thr_temp_rain:
    Type: float
    Units: °C
    Description: "Temperature threshold above which precipitation falls as rain."
  melt_factor_snow:
    Type: float
    Units: m yr^{-1} °C^{-1} w.e.
    Description: "Degree-day melt factor for snow, in water equivalent. The default corresponds to 3 mm w.e. d-1 °C-1 (value in mm w.e. d-1 °C-1 × 0.365242)."
  melt_factor_ice:
    Type: float
    Units: m yr^{-1} °C^{-1} w.e.
    Description: "Degree-day melt factor for ice, in water equivalent. The default corresponds to 8 mm w.e. d-1 °C-1 (value in mm w.e. d-1 °C-1 × 0.365242)."
  shift_hydro_year:
    Type: float
    Units: yr
    Description: "Fractional year shift for the start of the hydrological year."
  ice_density:
    Type: float
    Units: kg m^{-3}
    Description: "Ice density used for unit conversion."
  wat_density:
    Type: float
    Units: kg m^{-3}
    Description: "Water density used for unit conversion."
  smb_maximum_accumulation:
    Type: float
    Units: m yr^{-1}
    Description: "Cap on the accumulation rate to avoid unrealistically large values."
