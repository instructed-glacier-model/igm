update_freq:
  Type: float
  Units: y
  Description: "Frequency at which to update the avalanche module."
angleOfRepose:
  Type: float
  Units: degree
  Description: "Angle of repose (threshold for avalanche initiation)."
stop_redistribution_thk:
  Type: float
  Units: m
  Description: "Stop the iterative redistribution when the thickness to redistribute in one iteration (ice in excess of the angle of repose, non-zero only where avalanching occurs), summed and divided by the total number of grid cells, falls below this value. The remaining excess is then redistributed at once."
