update_freq:
  Type: float
  Units: y
  Description: "Update the mass balance each X years."
refreeze_factor:
  Type: float
  Units: dimless
  Description: "Refreezing factor."
thr_temp_snow:
  Type: float
  Units: ^{\circ}C
  Description: "Threshold temperature for solid precipitation."
thr_temp_rain:
  Type: float
  Units: ^{\circ}C
  Description: "Threshold temperature for liquid precipitation."
melt_factor_snow:
  Type: float
  Units: m yr^{-1} K^{-1} w.e.
  Description: "Degree-day factor for snow (water eq.); the default corresponds to 3 mm w.e. d-1 K-1."
melt_factor_ice:
  Type: float
  Units: m yr^{-1} K^{-1} w.e.
  Description: "Degree-day factor for ice (water eq.); the default corresponds to 8 mm w.e. d-1 K-1."
shift_hydro_year:
  Type: float
  Units: dimless
  Description: "This serves to start Oct 1. the acc/melt computation."
ice_density:
  Type: float
  Units: kg m^{-3}
  Description: "Density of ice for conversion of SMB into ice equivalent."
wat_density:
  Type: float
  Units: kg m^{-3}
  Description: "Density of water."
smb_maximum_accumulation:
  Type: float
  Units: m yr^{-1}
  Description: "Maximum accumulation rate."
