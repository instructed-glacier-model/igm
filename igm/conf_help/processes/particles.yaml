seeding:
  method:
    Type: string
    Units: dimless
    Description: "Seeding method: `accumulation` (seed at the surface of the accumulation area, where thk > 1 m and smb > 0, every `frequency` years) or `all` (seed the whole ice volume in layers spaced by `height` at the first time step, then at the surface wherever the cumulated accumulation exceeds `height`)."
  frequency:
    Type: float
    Units: y
    Description: "Frequency of seeding."
  density:
    Type: float
    Units: dimless
    Description: "Density of seeding (1 means we seed all pixels, 0.2 means we seed each 5 grid cell, etc.)"
  tlast_init:
    Type: float
    Units: y
    Description: "Initialize the date of last seeding. If default value, the seeding will start the first year of the simulation. Changing this value allows to defer it"
  height:
    Type: float
    Units: m
    Description: "Method `all` only: vertical spacing of the seeded layers, and cumulated accumulation (m ice eq.) that triggers a new surface seeding."
tracking:
  method:
    Type: string
    Units: dimless
    Description: "Method for tracking particles (3d or simple)."
  library:
    Type: string
    Units: dimless
    Description: "Library used to interpolate velocities at particle positions: `tensorflow` (default, portable, CPU or GPU), `cuda` (compiled TensorFlow custom op, NVIDIA GPU), or `cupy` (Numba CUDA kernel, requires `cupy` and `numba`)."
removal:
  method:
    Type: string
    Units: dimless
    Description: "Particle removal: empty string (none) or `ablation` (remove particles that have returned to the ice surface, i.e. relative height r = 1)."
output:
  library:
    Type: string
    Units: dimless
    Description: "Library used to write particle files: `numpy` (default, CSV only) or `cudf` (RAPIDS, GPU; supports the formats set by `format`)."
  add_topography:
    Type: boolean
    Units: dimless
    Description: "Add topography when writing particles."
  format:
    Type: string
    Units: dimless
    Description: "Output file format with `library: cudf`: `csv`, `feather`, or `parquet` (ignored with `numpy`, which always writes CSV)."
  add_fields:
    Type: list
    Units: dimless
    Description: "Extra particle fields to track and write: `weight`, `englt` (englacial time, yr), `velmag` (3D speed, m yr^{-1})."
