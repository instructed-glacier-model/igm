method:
  Type: string
  Description: "Type of method to determine the ice flow: emulated, solved, diagnostic, unified."
  Units: dimless
force_max_velbar:
  Type: float
  Description: "Upper-bound value for the velocities; applied if strictly positive."
  Units: m y^{-1}
physics:
  energy_components:
    Type: list
    Description: "List of energy components to compute; the available components are: gravity, viscosity, sliding."
    Units: dimless
  sliding:
    law:
      Type: string
      Description: "Type of sliding law."
      Units: dimless
    use_mask_gr:
      Type: boolean
      Description: "If True, zero out basal shear stress in floating areas."
      Units: dimless
    slidingco:
      Type: float
      Description: "Initial value for the reference basal shear stress (legacy stack: emulated/solved/diagnostic + data_assimilation; the field is named state.slidingco). Numerically equal to sliding.tau_ref."
      Units: MPa
    tau_ref:
      Type: float
      Description: "Initial value for the reference basal shear stress (new stack: iceflow.method=unified + field_inversion + pretraining; the field is named state.tau_ref). Numerically equal to sliding.slidingco."
      Units: MPa
    regularization:
      Type: float
      Description: "Regularization parameter for velocity magnitude (all laws)."
      Units: m y^{-1}
    exponent:
      Type: float
      Description: "Sliding-law velocity exponent m (sliding stress ~ |u|^{1/m}). Applies to all laws."
      Units: dimless
    u_ref:
      Type: float
      Description: "Reference basal velocity. Active in the 'unified' method only (default 100 m/yr). The emulated/solved/diagnostic stack uses slidingco directly as tau_ref at u_ref=1 and refuses to run unless u_ref=1.0."
      Units: m y^{-1}
    N_ref:
      Type: float
      Description: "Reference effective pressure (budd only; MPa, matching state.effective_pressure)."
      Units: MPa
    mu:
      Type: float
      Description: "Till coefficient (regu_coulomb only)."
      Units: dimless
    q_exponent:
      Type: float
      Description: "Effective-pressure exponent q (budd only). 1.0 recovers linear Budd, 0.5 gives Tsai sublinear."
      Units: dimless
    phi:
      Type: float
      Description: "Uniform friction angle (mohr_coulomb only). Used unless both bed_min and bed_max are finite."
      Units: deg
    phi_min:
      Type: float
      Description: "Friction angle at bed = bed_min (mohr_coulomb only)."
      Units: deg
    phi_max:
      Type: float
      Description: "Friction angle at bed = bed_max (mohr_coulomb only)."
      Units: deg
    bed_min:
      Type: float
      Description: "Lower bed elevation for friction-angle interpolation (mohr_coulomb only); NaN disables interpolation."
      Units: m
    bed_max:
      Type: float
      Description: "Upper bed elevation for friction-angle interpolation (mohr_coulomb only); NaN disables interpolation."
      Units: m
    tauc_min:
      Type: float
      Description: "Floor on tau_c after clipping (mohr_coulomb only)."
      Units: MPa
    tauc_max:
      Type: float
      Description: "Ceiling on tau_c after clipping (mohr_coulomb only)."
      Units: MPa
    tauc_ice_free:
      Type: float
      Description: "Hard tau_c assignment in ice-free cells (mohr_coulomb only)."
      Units: MPa
  gravity_cst:
    Type: float
    Description: "Gravitational constant."
    Units: m s^{-2}
  ice_density:
    Type: float
    Description: "Density of ice."
    Units: kg m^{-3}
  water_density:
    Type: float
    Description: "Density of water."
    Units: kg m^{-3}
  viscosity:
    arrhenius:
      Type: float
      Description: "Initial value for the Arrhenius factor in Glen's flow law."
      Units: MPa^{-n} y^{-1}
    enhancement_factor:
      Type: float
      Description: "Enhancement factor in Glen's flow law: prefactor multiplying the arrhenius factor."
      Units: dimless
    exponent:
      Type: float
      Description: "Glen's flow law exponent."
      Units: dimless
    regularization:
      Type: float
      Description: "Regularization parameter for Glen's flow law."
      Units: dimless
  thr_ice_thk:
    Type: float
    Description: "Minimal value for the ice thickness in the strain-rate computation."
    Units: m
  min_sr:
    Type: float
    Description: "Minimal value for the strain rate."
    Units: y^{-1}
  max_sr:
    Type: float
    Description: "Maximum value for the strain rate."
    Units: y^{-1}
  force_negative_gravitational_energy:
    Type: boolean
    Description: "Force the gravitational energy term to be negative."
    Units: dimless
  cf_eswn:
    Type: list
    Description: "This forces calving front at the border of the domain in the side given in the list."
    Units: dimless
numerics:
  precision:
    Type: string
    Description: "Precision type for the fields: single, double."
    Units: dimless
  ord_grad_u:
    Type: string
    Description: "Default type of norm used for the halt critera associated with the velocity."
    Units: dimless
  ord_grad_theta:
    Type: string
    Description: "Default type of norm used for the halt critera associated with the parameters."
    Units: dimless
  Nz:
    Type: integer
    Description: "Number of grid points for the vertical discretization."
    Units: dimless
  vert_spacing:
    Type: float
    Description: "Parameter controlling the discretization density to get more points near the bed than near the surface; a value 1.0 means uniform vertical spacing."
    Units: dimless
  basis_horizontal:
    Type: string
    Description: "Basis for the horizontal discretization."
    Units: dimless
  basis_vertical:
    Type: string
    Description: "Basis for the vertical discretization."
    Units: dimless
solver:
  step_size:
    Type: float
    Description: "Step size for the optimizer."
    Units: dimless
  nbitmax:
    Type: integer
    Description: "Maximum number of iterations for the optimizer."
    Units: dimless
  optimizer:
    Type: string
    Description: "Type of optimizer."
    Units: dimless
  print_cost:
    Type: boolean
    Description: "Display the cost during the optimization."
    Units: dimless
  fieldin:
    Type: list
    Description: "Input fields of the ice-flow solver."
    Units: dimless
emulator:
  fieldin:
    Type: list
    Description: "Input fields of the ice-flow emulator."
    Units: dimless
  retrain_freq:
    Type: integer
    Description: "Frequency at which the emulator is retrained."
    Units: dimless
  print_cost:
    Type: boolean
    Description: "Display the cost during the optimization."
    Units: dimless
  lr:
    Type: float
    Description: "Learning rate for the training of the emulator."
    Units: dimless
  lr_init:
    Type: float
    Description: "Initial learning rate for the training of the emulator."
    Units: dimless
  lr_decay:
    Type: float
    Description: "Decay learning-rate parameter for the training of the emulator."
    Units: dimless
  warm_up_it:
    Type: float
    Description: "Number of iterations for a warm-up period, allowing intense initial training."
    Units: dimless
  nbit_init:
    Type: integer
    Description: "Number of iterations done initially for the training of the emulator."
    Units: dimless
  nbit:
    Type: integer
    Description: "Number of iterations done at each time step for the training of the emulator."
    Units: dimless
  framesizemax:
    Type: integer
    Description: "Size of the patch used for training the emulator; this is useful for large size arrays as otherwise the GPU memory could be overloaded."
    Units: dimless
  split_patch_method:
    Type: string
    Description: "Method to split the patch for the emulator: sequential (usefull for large size arrays) or parallel."
    Units: dimless
  pretrained:
    Type: boolean
    Description: "Use a pretrained emulator instead of starting from scratch."
    Units: dimless
  name:
    Type: string
    Description: "Directory path of the pretrained ice-flow emulator; taken from the library if this is empty."
    Units: dimless
  save_model:
    Type: boolean
    Description: "Save the ice-flow emulator at the end of the simulation."
    Units: dimless
  exclude_borders:
    Type: integer
    Description: "Quick fix of the border issue; otherwise the emulator shows zero velocity at the border."
    Units: dimless
  optimizer:
    Type: string
    Description: "Type of optimizer for the emulator."
    Units: dimless
  optimizer_clipnorm:
    Type: float
    Description: "Maximum value for the gradient of each weight."
    Units: dimless
  optimizer_epsilon:
    Type: float
    Description: "Small constant for numerical stability of the Adam optimizer."
    Units: dimless
  save_cost:
    Type: string
    Description: "Name of the file containing the cost."
    Units: dimless
  output_directory:
    Type: string
    Description: "Directory of the file containing the cost."
    Units: dimless
  plot_sol:
    Type: boolean
    Description: "Plot the solution of the emulator at each time step."
    Units: dimless
  pertubate:
    Type: boolean
    Description: "Perturb the input fiels during the training."
    Units: dimless
  network:
    architecture:
      Type: string
      Description: "Type of network: cnn, unet."
      Units: dimless
    multiple_window_size:
      Type: integer
      Description: "For a U-Net, this requires the window size to be a multiple of 2 to the power N."
      Units: dimless
    activation:
      Type: string
      Description: "Type of activation function: lrelu, relu, tanh, sigmoid, ..."
      Units: dimless
    nb_layers:
      Type: integer
      Description: "Number of layers in the network."
      Units: dimless
    nb_blocks:
      Type: integer
      Description: "Number of block layers in the U-Net."
      Units: dimless
    nb_out_filter:
      Type: integer
      Description: "Number of output filters in the network."
      Units: dimless
    conv_ker_size:
      Type: integer
      Description: "Size of the convolution kernel."
      Units: dimless
    dropout_rate:
      Type: float
      Description: "Dropout rate in the CNN."
      Units: dimless
    weight_initialization:
      Type: string
      Description: "Initialization type for the network weights: glorot_uniform, he_normal, lecun_normal."
      Units: dimless
    cnn3d_for_vertical:
      Type: boolean
      Description: "Apply a 3D CNN instead of a 2D one for each horizontal layer."
      Units: dimless
    batch_norm:
      Type: boolean
      Description: "Apply a batch normalization layer."
      Units: dimless
    l2_reg:
      Type: float
      Description: "Amount of l2 regularization penalty."
      Units: dimless
    separable:
      Type: boolean
      Description: "Apply convolution layers that are separable."
      Units: dimless
    residual:
      Type: boolean
      Description: "Apply residual layer."
      Units: dimless
diagnostic:
  save_freq:
    Type: integer
    Description: "Frequency of the saving of the metrics."
    Units: dimless
  filename_metrics:
    Type: string
    Description: "Name of the file with the metrics."
    Units: dimless
unified:
  mapping:
    Type: string
    Description: "Type of mapping between the weights and the velocity."
    Units: dimless
  bcs:
    Type: list
    Description: "List of the applied boundary conditions; the available bcs are: frozen_bed, periodic_ns, periodic_we, no_slip, periodic_ns_global, periodic_we_global, no_slip_global."
    Units: dimless
  bc:
    dirichlet:
      left:
        Type: float
        Description: "Value enforced on the DOFs of the velocity at the left (west) border; note that this sets the degrees of freedom, not the velocity field itself."
        Units: m y^{-1}
      right:
        Type: float
        Description: "Value enforced on the DOFs of the velocity at the right (east) border; note that this sets the degrees of freedom, not the velocity field itself."
        Units: m y^{-1}
      top:
        Type: float
        Description: "Value enforced on the DOFs of the velocity at the top (north) border; note that this sets the degrees of freedom, not the velocity field itself."
        Units: m y^{-1}
      bottom:
        Type: float
        Description: "Value enforced on the DOFs of the velocity at the bottom (south) border; note that this sets the degrees of freedom, not the velocity field itself."
        Units: m y^{-1}
  optimizer:
    Type: string
    Description: "Type of optimizer used to solve the ice flow."
    Units: dimless
  nbit:
    Type: integer
    Description: "Number of iterations done to solve the ice flow."
    Units: dimless
  nbit_init:
    Type: integer
    Description: "Number of iterations done initially to solve the ice flow."
    Units: dimless
  nbit_warmup:
    Type: integer
    Description: "Number of iterations done for a warm-up period to solve the ice flow, allowing intense initial training."
    Units: dimless
  retrain_freq:
    Type: integer
    Description: "Frequency at which the ice flow is solved."
    Units: dimless
  retrain_threshold:
    Type: float
    Description: "Threshold (expressed as a z-score) above which the ice flow is re-solved."
    Units: dimless
  adam:
    lr:
      Type: float
      Description: "Learning rate for the Adam optimizer."
      Units: dimless
    lr_init:
      Type: float
      Description: "Initial learning rate for the Adam optimizer."
      Units: dimless
    lr_decay:
      Type: float
      Description: "Decay learning-rate parameter for the Adam optimizer."
      Units: dimless
    lr_decay_steps:
      Type: integer
      Description: "Number of steps during which the decay learning rate is applied for the Adam optimizer."
      Units: dimless
    optimizer_clipnorm:
      Type: float
      Description: "Maximum value for the gradient of each weight."
      Units: dimless
  lbfgs:
    memory:
      Type: integer
      Description: "Number of saved iteration results for the L-BFGS optimizer."
      Units: dimless
    alpha_min:
      Type: float
      Description: "Minimal value for the step size in the line search."
      Units: dimless
  cg_newton:
    cg_tol:
      Type: float
      Description: "Tolerance on the energy-norm residual of the CG linear solve; iteration continues while delta_new is greater than cg_tol squared times delta_0."
      Units: dimless
    warm_start:
      Type: boolean
      Description: "Reuse the previous Newton step direction as the initial guess for the next CG linear solve."
      Units: dimless
    cg_max_iter:
      Type: integer
      Description: "Maximum number of conjugate-gradient iterations in the CG-Newton optimizer."
      Units: dimless
    line_search_compile:
      Type: boolean
      Description: "CG-Newton only. If true, run the selected line search as a reusable TensorFlow graph. If false, use the faster eager Armijo loop when line_search is armijo; Wolfe and Hager-Zhang remain compiled because they have no eager path. Both Armijo paths reuse the cost and directional derivative already computed at the current iterate."
      Units: dimless
    print_timing:
      Type: boolean
      Description: "Print synchronized CG and total wall-clock timing for each Newton iteration. Intended for profiling because GPU synchronization slightly affects runtime."
      Units: dimless
    damping:
      Type: float
      Description: "Levenberg-Marquardt damping added to the Hessian diagonal, so CG solves (H + damping I) p = -g."
      Units: dimless
    damping_adaptive:
      Type: boolean
      Description: "Adapt the damping from line-search acceptance. Damping decreases when the quadratic model predicts a near-full step well and increases when it predicts poorly; this lets the method approach an undamped Newton step."
      Units: dimless
    damping_min:
      Type: float
      Description: "Lower bound for adaptive Levenberg-Marquardt damping."
      Units: dimless
    damping_max:
      Type: float
      Description: "Upper bound for adaptive Levenberg-Marquardt damping."
      Units: dimless
    damping_down:
      Type: float
      Description: "Multiplicative damping reduction applied when the line search accepts a near-full Newton step."
      Units: dimless
    damping_up:
      Type: float
      Description: "Multiplicative damping increase applied when the line search accepts only a very small Newton step."
      Units: dimless
    hvp_mode:
      Type: string
      Description: "Method used to compute Hessian-vector products: autodiff uses the exact reverse-over-reverse Hessian; banded extracts a frozen 9-point horizontal stencil by graph colouring for identity mappings. Nonperiodic SSA and Nz=2 MOLHO use compact stencils; other supported cases use generalized component blocks."
      Units: dimless
    hvp_verify:
      Type: boolean
      Description: "For hvp_mode=banded, compare the colour-extracted stencil with the exact autodiff Hessian on a random vector. This debug check is expensive because it traces the otherwise unused double-backward Hessian graph, so it should be enabled when changing the energy or discretization rather than in production."
      Units: dimless
    probe_mode:
      Type: string
      Description: "Method used by the component and spatial colouring probes when hvp_mode=banded: autodiff uses exact reverse-over-reverse Hessian-vector products and is the production MOLHO mode; fd uses central finite differences in double precision; forward uses exact forward-over-reverse products for validation. The number of probes depends on Nz and the periodic grid dimensions."
      Units: dimless
    preconditioner:
      Type: string
      Description: "CG preconditioner: none, block_jacobi, or barotropic_multigrid. The multigrid option requires identity-mapped MOLHO with Nz=2 and combines full four-component point smoothing with a two-component horizontal coarse correction."
      Units: dimless
    operator_update_freq:
      Type: integer
      Description: "Number of outer Newton iterations for which a frozen banded Hessian is reused. One rebuilds it every iteration."
      Units: dimless
    precond_update_freq:
      Type: integer
      Description: "Number of outer Newton iterations between preconditioner updates."
      Units: dimless
    multigrid:
      smoother_weight:
        Type: float
        Description: "Relaxation weight used by the symmetric point-block smoothers in barotropic_multigrid. It is capped at 0.5 on periodic duplicated-endpoint grids to preserve positive definiteness; 0.5 is also the validated ISMIP-HOM setting."
        Units: dimless
      smoother_steps:
        Type: integer
        Description: "Number of point-block smoothing steps before and after each coarse-grid correction."
        Units: dimless
      coarse_size:
        Type: integer
        Description: "Maximum horizontal size of the bottom multigrid level solved by dense Cholesky."
        Units: dimless
  error_estimator:
    enabled:
      Type: boolean
      Description: "Enable the diagnostic a-posteriori velocity-error estimator. At the current (network) velocity it evaluates the energy gradient g and the frozen banded Hessian H of cg_newton on a shadow identity mapping, runs k preconditioned CG iterations on (H + damping I) delta = -g (plus newton_steps-1 chord steps), and reports -delta as the estimated error in the units used to score network solves (median relative surface-velocity error over grounded and floating ice, RMSE). Validated against Newton-CG references on AIS 32-4 km, ASE 5-1 km and Aletsch (igm-ais/error_estimator_study.md). Diagnostic only: logs a JSONL line per estimate and publishes state.err_est_* scalars; it never changes the optimization, and when disabled it adds no operation to the optimizer graph."
      Units: dimless
    freq:
      Type: integer
      Description: "Period, in parameter updates, of the in-loop estimates made by Optimizer._estimate_error when an optimizer loop calls it (0 disables them; the start estimate is controlled by estimate_at_start). Each refresh of the frozen Hessian costs roughly one Newton step without line search, so keep freq large compared with that cost in optimizer iterations."
      Units: dimless
    estimate_at_start:
      Type: boolean
      Description: "Also estimate the error of the initial iterate before the loop starts (reported as iteration -1). Useful to decide whether an optimization is needed at all."
      Units: dimless
    cg_iters:
      Type: list
      Description: "Sorted list of PCG iteration counts k at which the first Newton step is read off and converted to metrics (one CG run, several checkpoints, keys k<k>_*). With the barotropic multigrid preconditioner k=5 is already converged on every validated case; use several values only for diagnostics. The largest k feeds the chord steps and, with newton_steps=1, is the estimate reported as est_*."
      Units: dimless
    cg_tol:
      Type: float
      Description: "Relative tolerance on the preconditioned residual of the PCG solve; iterations stop early when <r, P^-1 r> falls below cg_tol squared times its initial value."
      Units: dimless
    hvp_mode:
      Type: string
      Description: "Hessian-vector product mode for the shadow identity mapping: autodiff (exact, general) or banded (frozen 9-point stencil; compact MOLHO storage for Nz=2, compact SSA for Nz=1)."
      Units: dimless
    probe_mode:
      Type: string
      Description: "How banded stencils are probed: fd (central finite differences of the gradient; default, halves the first-call trace, exact enough in double precision and automatically replaced by autodiff when the estimator runs in single precision), autodiff (reverse-over-reverse), or forward (forward-over-reverse; traces very slowly on large grids)."
      Units: dimless
    hvp_verify:
      Type: boolean
      Description: "At the first estimate, compare the frozen banded Hessian with one exact autodiff Hessian-vector product and warn if they differ by more than 1e-6 relative (diagnoses energies that couple beyond the 9-point stencil)."
      Units: dimless
    preconditioner:
      Type: string
      Description: "Preconditioner for the estimator's PCG solve: none, block_jacobi, or barotropic_multigrid (MOLHO Nz=2 with hvp_mode banded)."
      Units: dimless
    multigrid:
      smoother_weight:
        Type: float
        Description: "Relaxation weight of the barotropic_multigrid point-block smoother used by the estimator."
        Units: dimless
      smoother_steps:
        Type: integer
        Description: "Smoothing steps before and after each coarse-grid correction in the estimator's multigrid preconditioner."
        Units: dimless
      coarse_size:
        Type: integer
        Description: "Maximum horizontal size of the bottom multigrid level solved by dense Cholesky in the estimator's preconditioner."
        Units: dimless
    damping:
      Type: float
      Description: "Levenberg-Marquardt damping added to the Hessian diagonal in the estimator's linear solve; keeps ice-free degrees of freedom nonsingular."
      Units: dimless
    operator_update_freq:
      Type: integer
      Description: "Optional upper bound on the number of estimates between refreshes of the frozen banded Hessian and preconditioner. Zero relies on the velocity- and input-change guards without a count cap; one rebuilds at every estimate. Between refreshes the stencil is reused at the new gradient, which removes ~85 % of the per-estimate cost."
      Units: dimless
    operator_refresh_rel_change:
      Type: float
      Description: "Refresh the frozen Hessian as soon as the RMS relative change of the velocity since the last refresh exceeds this value. Any change in the energy inputs also forces a refresh. A Hessian frozen at an early, near-zero iterate is useless a few hundred iterations later, so a count alone is unsafe."
      Units: dimless
    newton_steps:
      Type: integer
      Description: "Number of Newton-type steps accumulated into the estimate. 1 is the linearised correction, which under-estimates floating-ice error by 10-35 % on AIS 16-4 km; each further step is a chord step (gradient re-evaluated at u + delta, same frozen Hessian and preconditioner) costing one gradient and one PCG solve. Validation: 2 steps remove the bias (ratio 0.98-1.04 on AIS, 1.14 on ASE 1 km), 3 steps give 0.94-0.97 everywhere. Default 2 (within the 20 % accuracy target); use 3 for tighter estimates. The k-sweep (k*_ keys) always refers to the first step; step<n>_* keys hold the accumulated correction, which becomes est_*."
      Units: dimless
    disable_xla:
      Type: boolean
      Description: "Switch off XLA auto-clustering (enabled globally by the Adam optimizer module) while the estimator's own graphs are built and run. Auto-clustering the large double-precision Hessian graphs costs minutes of compile time and tens of GB of host memory at AIS 4-8 km; the optimizer's graphs keep their XLA setting."
      Units: dimless
    precision:
      Type: string
      Description: "Floating-point precision of the estimator (single or double); null uses numerics.precision. Double is the default because the banded Hessian probing and the multigrid coarsening lose positive definiteness in single precision once velocities are realistic (the preconditioner then returns NaN). When it differs from numerics.precision the estimator builds its own discretization constants and cost function in that precision."
      Units: dimless
    use_basin_mask:
      Type: boolean
      Description: "Restrict the error statistics to state.basinmask > 0.5 when that field exists (matches the ASE scoring convention)."
      Units: dimless
    record_path:
      Type: string
      Description: "Path (relative to the run directory) of the JSONL file receiving one line per estimate."
      Units: dimless
    save_fields_dir:
      Type: string
      Description: "If set, write the surface velocity of the iterate and the estimated surface error components to <dir>/fields_<n>.npz at every estimate (offline baselines such as iterate-difference extrapolation). null disables."
      Units: dimless
    publish_field:
      Type: boolean
      Description: "Publish the estimated surface-velocity error magnitude as the 2-D field state.err_est_surf so it can be listed in outputs vars_to_save."
      Units: dimless
    reference_file:
      Type: string
      Description: "Optional NetCDF with uvelsurf and vvelsurf of a reference solution on the same grid. When given, the true error of the current velocity (true_*) and of the corrected velocity u + delta (corr_*) are logged next to the estimate for validation."
      Units: dimless
    verbose:
      Type: boolean
      Description: "Print one summary line per estimate."
      Units: dimless
  gauss_newton:
    cg_max_iter:
      Type: integer
      Description: "Maximum PCG iterations for the damped network-weight Gauss-Newton system."
      Units: dimless
    forcing_eta_min:
      Type: float
      Description: "Minimum Eisenstat-Walker relative residual tolerance."
      Units: dimless
    forcing_eta_max:
      Type: float
      Description: "Maximum Eisenstat-Walker relative residual tolerance."
      Units: dimless
    forcing_gamma:
      Type: float
      Description: "Eisenstat-Walker forcing multiplier."
      Units: dimless
    forcing_power:
      Type: float
      Description: "Exponent applied to consecutive gradient-norm ratios."
      Units: dimless
    damping_rel_init:
      Type: float
      Description: "Initial LM damping relative to the estimated largest Gauss-Newton eigenvalue."
      Units: dimless
    damping_rel_min:
      Type: float
      Description: "Minimum relative LM damping."
      Units: dimless
    damping_rel_max:
      Type: float
      Description: "Maximum relative LM damping."
      Units: dimless
    lm_ratio_low:
      Type: float
      Description: "Actual/predicted reduction threshold below which damping increases."
      Units: dimless
    lm_ratio_high:
      Type: float
      Description: "Actual/predicted reduction threshold above which damping decreases."
      Units: dimless
    damping_down:
      Type: float
      Description: "Factor used to reduce Gauss-Newton damping after an accurate model step."
