    eta:
      Type: float
      Description: "Minimum ratio of actual to predicted reduction for accepting a step in the trust-region optimizer."
      Units: dimless
    damping:
      Type: float
      Description: "Damping added to the Hessian diagonal for regularization in the trust-region optimizer."
      Units: dimless
  muon:
    lr:
      Type: float
