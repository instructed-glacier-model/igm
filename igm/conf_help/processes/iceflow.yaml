      Description: "Nesterov momentum coefficient for the Muon optimizer."
      Units: dimless
    ns_steps:
      Type: integer
      Description: "Number of Newton-Schulz iterations used to orthogonalize the gradient update in the Muon optimizer."
      Units: dimless
    lr_1d:
      Type: float
      Description: "Learning rate for rank-1 parameters (biases) in the Muon optimizer; these receive plain Nesterov SGD."
      Units: dimless
  soap:
    lr:
      Type: float
