    solve_retries:
      Type: integer
      Description: "Maximum damped-solve retries after negative curvature or line-search rejection."
      Units: dimless
    power_iterations:
      Type: integer
      Description: "Power iterations used to estimate spectral scale with identity preconditioning."
      Units: dimless
    armijo_c1:
      Type: float
      Description: "Sufficient-decrease constant for stateless Gauss-Newton trial steps."
      Units: dimless
    armijo_contraction:
      Type: float
      Description: "Step contraction factor for the Gauss-Newton Armijo search."
      Units: dimless
    line_search_max_iter:
      Type: integer
      Description: "Maximum stateless cost evaluations in one Gauss-Newton line search."
      Units: dimless
    hu_mode:
      Type: string
      Description: "Velocity-space Hessian mode: banded or autodiff."
      Units: dimless
    probe_mode:
      Type: string
      Description: "Probe method used to assemble the banded velocity Hessian."
      Units: dimless
    hvp_verify:
      Type: boolean
      Description: "Compare the banded velocity Hessian with exact autodiff for debugging."
      Units: dimless
    preconditioner:
      Type: string
      Description: "Weight-space PCG preconditioner: auto selects Nyström for DahuNet and identity for FNO; explicit choices are identity and nystrom."
      Units: dimless
    precond_update_freq:
      Type: integer
      Description: "Accepted outer iterations between Nyström sketch refreshes."
      Units: dimless
    print_timing:
      Type: boolean
      Description: "Print parseable Gauss-Newton preparation, sketch, PCG, and line-search timings."
      Units: dimless
    nystrom:
      rank:
        Type: integer
        Description: "Requested randomized Nyström rank."
        Units: dimless
      seed:
        Type: integer
        Description: "Stateless random seed for Nyström sketches."
        Units: dimless
      sketch_memory_gb:
        Type: float
        Description: "Memory cap for the three large parameter-by-rank sketch tensors."
        Units: GiB
      minimum_rank:
        Type: integer
        Description: "Fall back to identity below this effective Nyström rank."
        Units: dimless
      print_timing:
        Type: boolean
        Description: "Synchronize and print detailed Nyström sketch/eigensolve timings for profiling."
        Units: dimless
    tridiag_newton:
      assembly:
        Type: string
        Units: dimless
        Description: "Hessian band assembly: 'probe' recovers bands using configured AD/finite-difference probes; 'analytic' directly assembles the exact Q1/SSA viscosity-and-sliding element Hessian for Ny=2 periodic-north-south flowlines."
      scalar_flowline:
        Type: boolean
        Units: dimless
        Description: "For an exactly y-invariant flowline with zero transverse velocity, solve only the symmetry-reduced flow-parallel scalar tridiagonal system. Initial-state validation rejects non-invariant inputs. Requires analytic assembly and the standard relative-cost stopping rule."
      damping:
        Type: float
        Description: "Levenberg-Marquardt damping added to the Hessian diagonal, so the direct solve is for (H + damping I) p = -g."
        Units: dimless
      damping_adaptive:
        Type: boolean
        Description: "Adapt the damping from line-search acceptance. Damping decreases when the quadratic model predicts a near-full step well and increases when it predicts poorly; this lets the method approach an undamped Newton step."
        Units: dimless
      damping_min:
        Type: float
        Description: "Lower bound for adaptive Levenberg-Marquardt damping."
        Units: dimless
      damping_max:
        Type: float
        Description: "Upper bound for adaptive Levenberg-Marquardt damping."
        Units: dimless
      damping_down:
        Type: float
        Description: "Multiplicative damping reduction applied when the line search accepts a near-full Newton step."
        Units: dimless
      damping_up:
        Type: float
        Description: "Multiplicative damping increase applied when the line search accepts only a very small Newton step."
        Units: dimless
      probe_mode:
        Type: string
        Description: "Method used when assembly=probe: autodiff uses exact reverse-over-reverse Hessian-vector products; fd uses central finite differences in double precision; forward uses exact forward-over-reverse products for validation."
        Units: dimless
  trust_region:
    cg_max_iter:
      Type: integer
      Description: "Maximum number of conjugate-gradient iterations for the trust-region sub-problem."
      Units: dimless
    cg_tol:
      Type: float
      Description: "Tolerance for the conjugate-gradient linear solver in the trust-region optimizer."
