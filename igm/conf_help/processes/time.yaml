start:
  Type: float
  Units: y
  Description: "Start time of the simulation."
end:
  Type: float
  Units: y
  Description: "End time of the simulation."
save:
  Type: float
  Units: y
  Description: "Frequency of saving the simulation results."
cfl:
  Type: float or [[t, cfl], ...]
  Units: dimless
  Description: "CFL condition for time stepping (0 or less: no CFL condition). Either a number, or a piecewise-constant schedule over model time [[t_0, cfl_0], [t_1, cfl_1], ...] with strictly increasing t_k (years, as start) and positive cfl_k: cfl_k applies from t_k on, and cfl_0 also before t_0."
step_max:
  Type: float or [[t, step], ...]
  Units: y
  Description: "Maximum time step allowed. Either a number, or a piecewise-constant schedule over model time [[t_0, s_0], [t_1, s_1], ...] with strictly increasing t_k (years, as start) and positive s_k: s_k applies from t_k on, and s_0 also before t_0. For example [[0.0, 0.01], [50.0, 0.1]] limits the time step to 0.01 y during the first 50 years, then to 0.1 y."
cfl_percentile:
  Type: float
  Units: "%"
  Description: "Percentile of |velocity| used in the CFL condition in place of the maximum (100 = exact maximum, default). Values below 100 ignore the fastest (100 - p)% of grid cells, so that a few outlier cells do not collapse the time step; the CFL guarantee then no longer holds in those cells. The percentile is taken over the active (ice-covered) cells when available, otherwise over all grid cells."
