start:
  Type: float
  Units: y
  Description: "Start time of the simulation."
end:
  Type: float
  Units: y
  Description: "End time of the simulation."
save:
  Type: float
  Units: y
  Description: "Frequency of saving the simulation results."
cfl:
  Type: float
  Units: dimless
  Description: "CFL condition for time stepping."
step_max:
  Type: float
  Units: y
  Description: "Maximum time step allowed."
cfl_percentile:
  Type: float
  Units: "%"
  Description: "Percentile of |velocity| used in the CFL condition in place of the maximum (100 = exact maximum, default). Values below 100 ignore the fastest (100 - p)% of grid cells, so that a few outlier cells do not collapse the time step; the CFL guarantee then no longer holds in those cells. The percentile is taken over all grid cells, including ice-free ones: keep it close to 100 (e.g. 99.9)."
