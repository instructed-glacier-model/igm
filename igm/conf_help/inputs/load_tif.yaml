coarsen:
  Type: int
  Units: dimless
  Description: "Coarsen the data from NetCDF file by a certain (integer) number (2 would be twice coarser ignore data each 2 grid points)"
crop:
  Type: boolean
  Units: dimless
  Description: "Crop the data from NetCDF file with given top/down/left/right bounds."
xmin:
  Type: float
  Units: m
  Description: "Crop the data from NetCDF file with the given minimum x bound."
xmax:
  Type: float
  Units: m
  Description: "Crop the data from NetCDF file with the given maximum x bound."
ymin:
  Type: float
  Units: m
  Description: "Crop the data from NetCDF file with the given minimum y bound."
ymax:
  Type: float
  Units: m
  Description: "Crop the data from NetCDF file with the given maximum y bound."
icemask_include:
  Type: boolean
  Units: dimless
  Description: "Generate an ice mask from the ESRI Shapefile given by icemask_shapefile."
icemask_shapefile:
  Type: string
  Units: dimless
  Description: "ESRI Shapefile used to generate the ice mask, looked up in the data folder (core.folder_data)."
icemask_invert:
  Type: boolean
  Units: dimless
  Description: "False: the shapefile polygons are areas that should remain ice free. True: they are areas that should contain glaciers."
