type:
  Type: string
  Units: dimless
  Description: "Type of file to be loaded, can be netcdf or tif."
filename:
  Type: string
  Units: dimless
  Description: "NetCDF input data file."
coarsening:
  boundary:
    Type: string
    Units: dimless
    Description: 'Method for coarsening the data from NetCDF file: skipping or cubic_spline.'
  ratio:
    Type: float
    Units: dimless
    Description: "Coarsen ratio."
crop:
  xmin:
    Type: float
    Units: m
    Description: "X left coordinate for cropping the NetCDF data."
  xmax:
    Type: float
    Units: m
    Description: "X right coordinate for cropping the NetCDF data."
  ymin:
    Type: float
    Units: m
    Description: "Y bottom coordinate for cropping the NetCDF data."
  ymax:
    Type: float
    Units: m
    Description: "Y top coordinate for cropping the NetCDF data."
icemask:
  include:
    Type: boolean
    Units: dimless
    Description: "Generate an ice mask from the ESRI Shapefile given by icemask.shapefile."
  shapefile:
    Type: string
    Units: dimless
    Description: "ESRI Shapefile used to generate the ice mask, looked up in the data folder (core.folder_data)."
  invert:
    Type: boolean
    Units: dimless
    Description: "False: the shapefile polygons are areas that should remain ice free. True: they are areas that should contain glaciers."
water_level:
  include:
    Type: boolean
    Units: dimless
    Description: "Create a uniform 2D `state.water_level` field. Only applied if `water_level` is not already loaded from the input data. Required by the iceflow `floating` energy component for marine / tidewater setups."
  value:
    Type: float
    Units: m
    Description: "Value (in metres) used to fill the uniform `water_level` field when `include: True`."
