type:
  Type: string
  Units: dimless
  Description: "Type of file to be loaded, can be netcdf or tif."
filename:
  Type: string
  Units: dimless
  Description: "NetCDF input data file."
coarsening:
  boundary:
    Type: string
    Units: dimless
    Description: 'Method for coarsening the data from NetCDF file: skipping or cubic_spline.'
  ratio:
    Type: float
    Units: dimless
    Description: "Coarsen ratio."
crop:
  xmin:
    Type: float
    Units: m
    Description: "X left coordinate for cropping the NetCDF data."
  xmax:
    Type: float
    Units: m
    Description: "X right coordinate for cropping the NetCDF data."
  ymin:
    Type: float
    Units: m
    Description: "Y bottom coordinate for cropping the NetCDF data."
  ymax:
    Type: float
    Units: m
    Description: "Y top coordinate for cropping the NetCDF data."
icemask:
  include:
    Type: boolean
    Units: dimless
    Description: "Generate an ice mask from the ESRI Shapefile given by icemask.shapefile."
  shapefile:
    Type: string
    Units: dimless
    Description: "ESRI Shapefile used to generate the ice mask, looked up in the data folder (core.folder_data)."
  invert:
    Type: boolean
    Units: dimless
    Description: "False: the shapefile polygons are areas that should remain ice free. True: they are areas that should contain glaciers."
water_level:
  include:
    Type: boolean
    Units: dimless
    Description: "If True, fill `state.water_level` with the uniform `value` (a sea or lake level). If False (default), the domain has no ocean: `state.water_level` is filled with the \"no ocean\" level (-1e6 m), so nothing floats and lsurf = topg (right for mountain glaciers and for sub-zero synthetic beds such as ISMIP-HOM). A `water_level` variable in the input file takes precedence over both. With an ocean, also list water_level in processes.iceflow.unified.inputs."
  value:
    Type: float
    Units: m
    Description: "Uniform water level (m) used when `include: True`, e.g. 0.0 for present-day sea level."
