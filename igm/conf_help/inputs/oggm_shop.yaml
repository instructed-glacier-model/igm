RGI_ID:
  Type: string
  Description: "RGI ID of the selected glacier, G stands for individual Glacier, and C for glacier Complex for RGI7."
  Units: dimless
RGI_IDs:
  Type: list
  Description: "List of RGI IDs of the selected glaciers, G stands for individual Glacier, and C for glacier Complex for RGI7."
  Units: dimless
preprocess:
  Type: boolean
  Description: "Use OGGM preprocessing if you are fine with given spatial resolution and border size."
  Units: dimless
dx:
  Type: float
  Description: "Spatial resolution (need preprocess false to change it)."
  Units: m
border:
  Type: int
  Description: "Safe border margin, number of pixels, (need preprocess false to change it)."
  Units: dimless
thk_source:
  Type: string
  Description: "Millan ice thickness (millan_ice_thickness) or consensus ice thickness (consensus_ice_thickness)."
  Units: dimless
vel_source:
  Type: string
  Description: "Source of the surface velocities (millan_ice_velocity or its_live)."
  Units: dimless
incl_glathida:
  Type: boolean
  Description: "Set this to True for retrieving the GlaThiDa ice thickness profiles for the inversion."
  Units: dimless
filename:
  Type: string
  Units: dimless
  Description: "NetCDF input data file created by OGGM."
remove_RGI_folder:
  Type: boolean
  Description: "Remove downloaded RGI folder."
  Units: dimless
sub_entity_mask:
  Type: boolean
  Description: "Ice mask shows individual RGI 7.0G entities within each larger RGI 7.0C complex. Also produces a mask of glaciers with tidewater termini (RGI7.0C or G only)"
  Units: dimless
smooth_obs_vel:
  Type: boolean
  Description: "Smooth the observed velocities."
  Units: dimless
highres:
  Type: boolean
  Description: "Use high resolution data."
  Units: dimless
OGGM_server_v7:
  Type: string
  Description: "The address of the OGGM server for RGI7.0 directories (if highres = False)"
  Units: dimless
OGGM_server_v7_hr:
  Type: string
  Description: "The address of the OGGM server for RGI7.0 high-resolution directories (if highres = True)"
  Units: dimless
OGGM_server_v6:
  Type: string
  Description: "The address of the OGGM server for RGI6.0 directories."
  Units: dimless
glathida_server:
  Type: string
  Description: "The address of the GlaThiDa server to download thickness profiles from."
  Units: dimless
