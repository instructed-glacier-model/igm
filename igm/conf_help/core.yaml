url_data:
  Type: string
  Description: "URL from which to download `.nc` data files automatically."
  Units: dimless
folder_data:
  Type: string
  Description: "Local folder that holds input data downloaded or used by IGM."
  Units: dimless
logging_file:
  Type: string
  Description: "Path to a file for logging output. Leave empty to log to stdout only."
  Units: dimless
logging:
  Type: boolean
  Description: "Enable file-based logging."
  Units: dimless
tf_logging_level:
  Type: string
  Description: "TensorFlow logging verbosity level (`DEBUG`, `INFO`, `WARNING`, `ERROR`)."
  Units: dimless
igm_logging_level:
  Type: string
  Description: "IGM logging verbosity level (`DEBUG`, `INFO`, `WARNING`, `ERROR`)."
  Units: dimless
hardware:
  gpu_info:
    Type: boolean
    Description: "Print GPU information at startup."
    Units: dimless
  visible_gpus:
    Type: list
    Description: "List of GPU device indices made visible to IGM. Only one GPU is used at a time."
    Units: dimless
  strategy:
    Type: string
    Description: "TensorFlow distribution strategy (`none`, `mirrored`, etc.)."
    Units: dimless
  profile:
    Type: boolean
    Description: "Enable TensorFlow profiling for performance analysis."
    Units: dimless
print_params:
  Type: boolean
  Description: "Print the full resolved parameter configuration at startup."
  Units: dimless
print_comp:
  Type: boolean
  Description: "Print computational performance information (timing, throughput)."
  Units: dimless
print_info:
  Type: boolean
  Description: "Print live simulation progress (time, time step, ice volume)."
  Units: dimless
print_imported_modules:
  Type: boolean
  Description: "Print the list of imported modules at startup."
  Units: dimless
check_compat_params:
  Type: boolean
  Description: "Check that user-defined parameter names match known defaults, catching typos early."
  Units: dimless
check_module_needs:
  Type: boolean
  Description: "Check, right after init, that every module's declared input variables exist on state. Set False to skip (e.g. when a needed variable is produced during update rather than at init)."
  Units: dimless
aliases:
  builtin:
    Type: list
    Description: "Built-in alias sets to load ('descriptive', 'pism'). Empty by default — no aliases are active unless explicitly listed."
    Units: dimless
  extra_files:
    Type: list
    Description: "Paths to custom alias YAML files (alias_name: canonical_name pairs). Resolved relative to the working directory."
    Units: dimless
structure:
  root_foldername:
    Type: string
    Description: "Root folder for custom modules, relative to the working directory."
    Units: dimless
  conf_foldername:
    Type: string
    Description: "Sub-folder inside the root folder containing Hydra configuration stubs."
    Units: dimless
  code_foldername:
    Type: string
    Description: "Sub-folder inside the root folder containing Python module source files."
    Units: dimless
  input_modules_foldername:
    Type: string
    Description: "Sub-folder name for custom input modules."
    Units: dimless
  process_modules_foldername:
    Type: string
    Description: "Sub-folder name for custom process modules."
    Units: dimless
  assimilation_modules_foldername:
    Type: string
    Description: "Sub-folder name for custom assimilation modules."
    Units: dimless
  output_modules_foldername:
    Type: string
    Description: "Sub-folder name for custom output modules."
    Units: dimless
checkpoint:
  enabled:
    Type: boolean
    Description: "Write checkpoints of the whole model state in the run directory and honour graceful stop requests (signals, stop file). Off by default."
    Units: dimless
  restart:
    Type: string
    Description: "`auto` resumes from a checkpoint if one is found in the run directory (pass the same `hydra.run.dir=`); `True` requires one; `False` always starts afresh."
    Units: dimless
  folder:
    Type: string
    Description: "Folder holding the checkpoint (`state.npz` + `manifest.json`), relative to the run directory."
    Units: dimless
  every_save:
    Type: integer
    Description: "Write a checkpoint every N output-saving times (`processes.time.save`). 0 disables this trigger."
    Units: dimless
  every_iter:
    Type: integer
    Description: "Write a checkpoint every N time iterations. 0 disables this trigger."
    Units: dimless
  every_seconds:
    Type: float
    Description: "Write a checkpoint every N seconds of wall-clock time. 0 disables this trigger."
    Units: s
  signals:
    Type: list
    Description: "Signals that request a graceful stop (e.g. `SIGUSR1` sent by SLURM `--signal=B:USR1@300`): the current iteration finishes, a checkpoint is written, the process exits."
    Units: dimless
  stop_file:
    Type: string
    Description: "Name of a file whose presence in the run directory requests a graceful stop (`touch STOP`). Empty disables it."
    Units: dimless
  exit_code:
    Type: integer
    Description: "Process exit code after a graceful stop; some schedulers requeue on a specific code."
    Units: dimless
  keep_on_finish:
    Type: boolean
    Description: "Keep the last checkpoint once the run has completed (by default it is removed so a re-run starts afresh)."
    Units: dimless
  check_config:
    Type: boolean
    Description: "Warn when the current configuration differs from the one stored in the checkpoint being resumed."
    Units: dimless
